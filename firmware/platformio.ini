; AgentTouch firmware — Waveshare ESP32-S3-Touch-AMOLED-2.16
; Stack proven by claude-desktop-buddy-esp32 / Waveshare Arduino examples.

[platformio]
extra_configs = platformio.local.ini

[env:amoled216]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600
; src/almanac_font.h (Chinese glyphs) is baked from this Mac's system fonts
; before the first compile; see gen_font_table.py
extra_scripts = pre:gen_font_table.py
; Port auto-detected: the board is the only usbmodem device; the glob keeps
; working when the USB port (and thus the number) changes.
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DXPOWERS_CHIP_AXP2101
    ; audio.cpp wraps these so the i2s driver's context lands in internal RAM
    ; (GDMA_ISR_IRAM_SAFE rejects PSRAM; prebuilt IDF libs can't change Kconfig)
    -Wl,--wrap=heap_caps_malloc
    -Wl,--wrap=heap_caps_calloc

; Libraries, pinned. A developer's machine where the registry is slow can
; point them at local zips in platformio.local.ini (gitignored; it overrides
; lib_deps below, e.g. file://vendor/ArduinoJson-7.4.2.zip). Override
; lib_deps only: a different platform line re-downloads the whole toolchain.
lib_deps =
    moononournation/GFX Library for Arduino@1.6.4
    lewisxhe/XPowersLib@0.2.9
    lewisxhe/SensorLib@0.3.3
    bblanchon/ArduinoJson@7.4.2
    h2zero/NimBLE-Arduino@2.5.1
    ; U8g2 is only here so Arduino_GFX's __has_include(<U8g2lib.h>) turns on
    ; its u8g2 font renderer (pages use Logisoso, see src/pet_fonts.h)
    ; registry tops out at 2.36.18; 2.36.19 is the GitHub tag we test on
    https://github.com/olikraus/U8g2_Arduino/archive/refs/tags/2.36.19.zip
